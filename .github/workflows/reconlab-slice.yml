name: ReconLab synthetic slice

on:
  push:
    paths:
      - "ai-fullstack-workbench/**"
      - ".github/workflows/reconlab-slice.yml"
  pull_request:
    paths:
      - "ai-fullstack-workbench/**"
      - ".github/workflows/reconlab-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-fullstack-workbench/apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q

  react-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-fullstack-workbench/apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # First slice, lockfile pending. Do not deploy until lockfile is committed and npm ci succeeds.
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run build
