name: Roadmap document integrity

on:
  push:
    paths:
      - "ROADMAP.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/roadmap-integrity.yml"
  pull_request:
    paths:
      - "ROADMAP.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/roadmap-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roadmap-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Python 3
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Node 24 for zero-dependency JS mechanism lab
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run deterministic request-race learning experiment
        run: node --test docs/learning/labs/request-race.test.mjs
      - name: Check canonical roadmap structure, gates, progress, links
        run: python docs/quality/check_roadmap.py
      - name: Validate knowledge graph and on-demand routing
        run: |
          python docs/quality/check_knowledge_map.py
          python -m unittest discover -s docs/quality -p 'test_need_router.py'
      - name: Validate 2026 incremental learning integration
        run: python docs/quality/check_2026_integration.py
