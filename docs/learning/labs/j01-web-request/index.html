<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学校查询系统｜J01 L00</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
    form { display: flex; gap: 8px; flex-wrap: wrap; }
    input, button { padding: 10px; font-size: 1rem; }
    input { flex: 1; min-width: 180px; }
    li { padding: 6px 0; }
    .hint { color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>学校查询系统</h1>
    <p class="hint">仅使用合成演示数据，不可用于真实志愿填报。</p>
    <form id="searchForm">
      <label for="keyword">学校名称</label>
      <input id="keyword" name="q" placeholder="输入学校名称，例如广东">
      <button type="submit">查询</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <ul id="schoolList"></ul>
  </main>

  <script>
    const form = document.querySelector("#searchForm");
    const input = document.querySelector("#keyword");
    const status = document.querySelector("#status");
    const list = document.querySelector("#schoolList");

    async function searchSchools() {
      const keyword = input.value.trim();
      status.textContent = "查询中...";
      list.replaceChildren();

      try {
        const response = await fetch(
          "/api/schools?q=" + encodeURIComponent(keyword)
        );
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        const data = await response.json();
        data.items.forEach((school) => {
          const li = document.createElement("li");
          li.textContent = school.name + "（" + school.province + "）";
          list.appendChild(li);
        });
        status.textContent = "找到 " + data.total + " 所学校";
      } catch (error) {
        status.textContent = "请求失败：" + error.message;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      searchSchools();
    });
    searchSchools();
  </script>
</body>
</html>
